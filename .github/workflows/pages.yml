name: Docs site

# The site is an xzor app: it is rebuilt when its pages, the compiler, the runtime or the grammar change.
on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - runtime/**
      - src/**
      - editors/vscode/syntaxes/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0

    - uses: dtolnay/rust-toolchain@stable

    - name: Build
      env:
        # GitHub Pages serves a project site under /<repo>/.
        BASE: /${{ github.event.repository.name }}/
      run: |
        bun install --frozen-lockfile
        bun docs/site/publish.ts "$BASE"

    - uses: actions/upload-pages-artifact@v5
      with:
        path: docs/site/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
